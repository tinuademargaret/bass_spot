[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bass-spot"
version = "0.1.0"
description = "Learning acoustic response fields for speaker placement"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.14,<2", "torch>=2.2,<3", "matplotlib>=3.8,<4", "streamlit>=1.40,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
bass-spot = "bass_spot.cli:main"

[tool.setuptools.packages.find]
include = ["bass_spot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402"]
